# Lint + tests on every push and PR. Needs no data: tests that read the local
# processed/ snapshot are marked `snapshot` and skip themselves here. The data
# refresh and rendering stay local (ops/run_weekly.sh), by design.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt -e .
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
